name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "modulo-01-html/projeto-final/**"
      - "modulo-02-css/projeto-final/**"
      - "modulo-03-javascript/projeto-final/**"
      - "projeto-final/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/html _site/css _site/javascript _site/projeto-final
          cp -R docs/. _site/
          cp -R modulo-01-html/projeto-final/. _site/html/
          cp -R modulo-02-css/projeto-final/. _site/css/
          cp -R modulo-03-javascript/projeto-final/. _site/javascript/
          cp -R projeto-final/. _site/projeto-final/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
